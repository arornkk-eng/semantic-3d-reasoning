name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 后端：lint + 类型(报告) + 单元测试
  # 单测只需轻量依赖（fastapi/numpy/plyfile）；重型 GPU 栈(torch/cuda)
  # 不在单测范围，需在团队 GPU 环境做集成验证。
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # 单测所需的轻量运行时依赖（非 GPU）
          pip install "fastapi" "numpy" "plyfile"

      - name: Ruff (lint)
        run: ruff check backend

      - name: Ruff (format check)
        run: ruff format --check backend

      - name: Mypy (类型检查)
        # 当前为「报告模式」：不阻断合入，团队逐步收紧后改为门禁。
        continue-on-error: true
        run: mypy backend

      - name: Pytest
        run: pytest backend/tests -q

  # ---------------------------------------------------------------------------
  # 前端：lint + 构建（已有 oxlint + tsc 严格配置）
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build
